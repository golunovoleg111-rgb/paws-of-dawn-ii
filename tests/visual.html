<!doctype html><meta charset="utf-8"><title>Проверка персонажей 0.4</title><base href="../"><style>body{background:#101927;color:#e4d6b5;font:15px sans-serif;margin:20px}header{position:sticky;top:0;background:#101927;z-index:3;padding:12px}button,select{background:#29374a;color:#eee0bb;border:1px solid #9e865d;border-radius:4px;padding:8px;margin:3px}#sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#263143;border:1px solid #566378;border-radius:8px;text-align:center}canvas{width:100%;height:360px;object-fit:contain}h3{margin:12px}#report{white-space:pre-wrap}</style><header><h1>Проверка поз и соединений</h1><div id="heroes"></div><div id="weapons"></div><button id="raster">Проверить соединения во всех позах</button><p id="status">Загрузка…</p><pre id="report"></pre></header><div id="sheet"></div><script type="module">
import{ArticulatedCast,BODY_PROFILES}from'./src/rig.js?v=041';
const cast=new ArticulatedCast();await Promise.all(cast.promises);let hero=0,weapon='sword';const names=['Мисти','Коди','Гектор','Зюзя','Крыса','Страж'],weapons=['sword','sabre','bow','hammer','moonblade','royalbow'];const poses=[['idle',0,'Покой'],['walk',.12,'Шаг'],['run',.42,'Бег'],['attack',.2,'Замах'],['attack',.57,'Удар'],['attack',.88,'Возврат'],['crouch',.5,'Красться'],['jump',.5,'Прыжок'],['interact',.5,'Действие']];
function draw(){document.querySelector('#sheet').innerHTML='';cast.weapon=weapon;for(const[action,phase,label]of poses){const card=document.createElement('section');card.className='card';card.innerHTML='<h3>'+names[hero]+' · '+label+'</h3>';const cv=document.createElement('canvas');cv.width=360;cv.height=380;card.append(cv);document.querySelector('#sheet').append(card);const c=cv.getContext('2d');c.strokeStyle='#d5ba7e';c.beginPath();c.moveTo(25,350);c.lineTo(335,350);c.stroke();c.save();c.translate(170,348);c.scale(3.25,3.25);cast.draw(c,0,0,hero,1,action,1,phase,{snap:true,stride:phase*Math.PI*2,speed:action==='run'?245:action==='walk'?110:0});c.restore()}document.querySelector('#status').textContent=names[hero]+' · '+weapon+' · загружено '+Object.keys(cast.sheets).length+'/7'}
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{hero=i;draw()};document.querySelector('#heroes').append(b)});weapons.forEach(w=>{const b=document.createElement('button');b.textContent=w;b.onclick=()=>{weapon=w;draw()};document.querySelector('#weapons').append(b)});
function components(p,w,h){const seen=new Uint8Array(w*h),q=new Int32Array(w*h),parts=[];for(let a=0;a<w*h;a++){if(seen[a]||p[a*4+3]<100)continue;let head=0,tail=1;q[0]=a;seen[a]=1;while(head<tail){const i=q[head++],x=i%w,y=Math.floor(i/w);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy,j=ny*w+nx;if(nx>=0&&ny>=0&&nx<w&&ny<h&&!seen[j]&&p[j*4+3]>=100){seen[j]=1;q[tail++]=j}}}parts.push(tail)}return parts.filter(n=>n>22).sort((a,b)=>b-a)}
document.querySelector('#raster').onclick=async()=>{const cv=document.createElement('canvas');cv.width=200;cv.height=170;const c=cv.getContext('2d',{willReadFrequently:true});const border=document.createElement('canvas');border.width=360;border.height=340;const bc=border.getContext('2d',{willReadFrequently:true});let count=0,bad=[],cropped=[];for(let h=0;h<6;h++)for(const action of ['idle','walk','run','crouch','jump','interact','attack'])for(let frame=0;frame<16;frame++){for(const w of action==='attack'?weapons:['sword']){cast.weapon=w;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,200,170);c.save();c.translate(100,145);c.scale(1.35,1.35);cast.draw(c,0,0,h,1,action,1,frame/16,{snap:true,hideWeapon:true,hideShadow:true,stride:frame/16*Math.PI*2,speed:action==='run'?245:action==='walk'?110:0});c.restore();const parts=components(c.getImageData(0,0,200,170).data,200,170);if(parts.length>1)bad.push(names[h]+' '+action+' '+frame+'/16 '+w+' части '+parts.join(','));bc.setTransform(1,0,0,1,0,0);bc.clearRect(0,0,360,340);bc.save();bc.translate(action==='attack'?135:160,325);const displayScale=action==='attack'?2.35:2.85;bc.scale(displayScale,displayScale);cast.draw(bc,0,0,h,1,action,1,frame/16,{snap:true,hideShadow:true,stride:frame/16*Math.PI*2,speed:action==='run'?245:action==='walk'?110:0});bc.restore();const edges=[bc.getImageData(0,0,360,2).data,bc.getImageData(0,338,360,2).data,bc.getImageData(0,0,2,340).data,bc.getImageData(358,0,2,340).data];if(edges.some(bytes=>{for(let q=3;q<bytes.length;q+=4)if(bytes[q]>100)return true;return false}))cropped.push(names[h]+' '+action+' '+frame+'/16 '+w);count++;}if(count%24===0){document.querySelector('#report').textContent='Проверено '+count+' · разрывы '+bad.length+' · обрезания '+cropped.length;await new Promise(r=>setTimeout(r,0))}}document.querySelector('#report').textContent='Проверено '+count+' · разрывы '+bad.length+' · обрезания '+cropped.length+'\n'+bad.slice(0,15).concat(cropped.slice(0,15)).join('\n');};draw();
</script>
